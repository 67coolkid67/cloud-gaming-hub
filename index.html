<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chromebook Cloud Play</title>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px;
        }
        h1 { color: #00ff88; margin-bottom: 30px; }
        .grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: #1c1c1e;
            border: 2px solid #2c2c2e;
            border-radius: 12px;
            padding: 20px;
            width: 220px;
            transition: 0.3s;
        }
        .card:hover { border-color: #00ff88; transform: translateY(-5px); }
        .btn {
            display: inline-block;
            background-color: #00ff88;
            color: #121214;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>My Cloud Gaming Hub</h1>
    <p>Launch free cloud streaming sessions instantly from my Chromebook</p>

    <div class="grid">
        <!-- Card 1: Fortnite / Free Games -->
        <div class="card">
            <h3>Xbox Cloud Gaming</h3>
            <p>Play Fortnite completely free without a subscription.</p>
            <a href="https://xbox.com" target="_blank" class="btn">Play Free</a>
        </div>

        <!-- Card 2: GeForce NOW -->
        <div class="card">
            <h3>GeForce NOW</h3>
            <p>Stream your own Steam/Epic games on a free 1-hour tier.</p>
            <a href="https://geforcenow.com" target="_blank" class="btn">Launch Rig</a>
        </div>
    </div>

</body>
</html>
